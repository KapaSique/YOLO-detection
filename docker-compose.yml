services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: yolo
      POSTGRES_PASSWORD: yolo
      POSTGRES_DB: yolo_guard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yolo -d yolo_guard"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./configs:/app/configs:ro
      - ./artifacts/weights:/app/artifacts/weights
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  cv:
    # For Linux webcam passthrough use: docker compose -f docker-compose.yml -f docker-compose.camera.yml up
    build:
      context: .
      dockerfile: docker/cv.Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./configs:/app/configs:ro
      - ./artifacts/weights:/app/artifacts/weights
      - ./storage:/app/storage

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
